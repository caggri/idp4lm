{{ define "css" }}
<link rel="stylesheet" href="/static/css/common.css">
{{ end }}

{{ define "content" }}
<div class="page-container">
    <h1 class="page-title">Configure</h1>
    <div class="content-card">
        <form id="deploymentForm">
            <div class="deployment-list">
                <div class="deployment-header">
                    <div class="deployment-info-header"><span>Deployment</span></div>
                    <div class="replica-control-header"><span>Replicas</span></div>
                    <div class="service-control-header"><span>Service</span></div>
                </div>

                <div class="deployment-item">
                    <div class="deployment-info">
                        <input type="checkbox" id="appDeployment" name="deployments" value="app" {{ if .HasApp }}checked{{ end }}>
                        <label for="appDeployment">App Deployment</label>
                    </div>
                    <div class="replica-control">
                        <input type="number" min="1" max="5" value="1" id="appReplicas" disabled>
                    </div>
                    <div class="service-control">
                        <input type="checkbox" id="appServiceEnabled" {{ if .HasAppSvc }}checked{{ else }}disabled{{ end }}>
                    </div>
                </div>

                <div class="deployment-item">
                    <div class="deployment-info">
                        <input type="checkbox" id="redisDeployment" name="deployments" value="redis" {{ if .HasRedis }}checked{{ end }}>
                        <label for="redisDeployment">Redis Deployment</label>
                    </div>
                    <div class="replica-control">
                        <input type="number" min="1" max="2" value="1" id="redisReplicas" disabled>
                    </div>
                    <div class="service-control">
                        <input type="checkbox" id="redisServiceEnabled" {{ if .HasRedisSvc }}checked{{ else }}disabled{{ end }}>
                    </div>
                </div>

                <div class="deployment-item">
                    <div class="deployment-info">
                        <input type="checkbox" id="mysqlDeployment" name="deployments" value="mysql" {{ if .HasMysql }}checked{{ end }}>
                        <label for="mysqlDeployment">MySQL Deployment</label>
                    </div>
                    <div class="replica-control">
                        <input type="number" id="mysqlReplicas" min="1" max="2" value="{{ if .HasMysql }}{{ .MysqlReplicas }}{{ else }}1{{ end }}" disabled>
                    </div>
                    <div class="service-control">
                        <input type="checkbox" id="dbServiceEnabled" {{ if .HasMysqlSvc }}checked{{ else }}disabled{{ end }} >
                    </div>
                </div>
            </div>

            <div class="center-button">
                <button type="button" id="createDeploymentBtn" class="nav-btn">
                    <span>🚀</span> Create Deployments
                </button>
            </div>
        </form>
    </div>

    <div class="nav-buttons">
        <a href="/dashboard?ns={{ .Namespace }}" class="nav-btn">
            <span>📊</span> Dashboard
        </a>
    </div>
</div>
{{ end }}

{{ define "javascript" }}
<script src="/static/js/configure.js"></script>
{{ end }}
